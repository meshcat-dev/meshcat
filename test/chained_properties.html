<!DOCTYPE html>
<html>
    <head>
        <meta charset=utf-8>
        <title>MeshCat</title>
    </head>
    <body>
        <div id="test-message">
            <p>
            This test exercises chained property assignment error behavior and
            reports PASS or FAIL automatically.
            </p>
            <p>
            If you need to debug a FAIL message, open the developer console
            (F12) for more details.
            </p>
            <div id="status-message">Running...</div>
            <ul id="test-results"></ul>
        </div>
        <div id="meshcat-pane">
        </div>

        <script src="../dist/main.min.js"></script>
        <script>
        const viewer = new MeshCat.Viewer(document.getElementById("meshcat-pane"));
        const status_dom = document.getElementById("status-message");
        const results_dom = document.getElementById("test-results");
        const failures = [];
        const original_console_error = console.error.bind(console);
        const original_console_warn = console.warn.bind(console);
        const observed_errors = [];
        const observed_warnings = [];

        console.error = (...args) => {
            observed_errors.push(args.map((x) => String(x)).join(" "));
            original_console_error(...args);
        };
        console.warn = (...args) => {
            observed_warnings.push(args.map((x) => String(x)).join(" "));
            original_console_warn(...args);
        };

        function record_result(ok, message) {
            const item = document.createElement("li");
            item.textContent = `${ok ? "PASS" : "FAIL"}: ${message}`;
            item.className = ok ? "pass" : "fail";
            results_dom.appendChild(item);
            if (ok) {
                console.info(item.textContent);
            } else {
                failures.push(message);
                original_console_error(item.textContent);
            }
        }

        function assert_equal(actual, expected, label) {
            record_result(actual === expected, `${label}: expected ${expected}, got ${actual}`);
        }

        function assert_undefined(actual, label) {
            record_result(actual === undefined, `${label}: expected undefined`);
        }

        function run_with_expected_logs(expected_errors, expected_warnings, label, callback) {
            const error_start = observed_errors.length;
            const warn_start = observed_warnings.length;
            callback();
            const error_delta = observed_errors.length - error_start;
            const warn_delta = observed_warnings.length - warn_start;
            assert_equal(error_delta, expected_errors, `${label} error count`);
            assert_equal(warn_delta, expected_warnings, `${label} warning count`);
        }

let obj_contents = `
mtllib ./cube.mtl
usemtl material_0

v 0.0 0.0 0.0
v 1.0 0.0 0.0
v 1.0 1.0 0.0
v 0.0 1.0 0.0
v 0.0 0.0 1.0
v 1.0 0.0 1.0
v 1.0 1.0 1.0
v 0.0 1.0 1.0

vt 0.3 0.875
vt 0.2 0.625
vt 0.3 0.625
vt 0.6 0.625
vt 0.3 0.375
vt 0.3 0.125

vn 0 0 -1
vn 0 0 1
vn 0 -1 0
vn 1 0 0
vn 0 1 0
vn -1 0 0

f 3/5/1 2/5/1 1/5/1
f 1/5/1 4/5/1 3/5/1
f 5/1/2 6/1/2 7/1/2
f 7/1/2 8/1/2 5/1/2
f 1/3/3 2/3/3 6/3/3
f 6/3/3 5/3/3 1/3/3
f 2/4/4 3/4/4 7/4/4
f 7/4/4 6/4/4 2/4/4
f 3/6/5 4/6/5 8/6/5
f 8/6/5 7/6/5 3/6/5
f 4/2/6 1/2/6 5/2/6
f 5/2/6 8/2/6 4/2/6
`;

    function run_test() {
        const path = "/meshcat/mesh_test";
        viewer.handle_command({
            type: "set_object",
            path: path,
            object: {
                metadata: {version: 4.5, type: "Object"},
                geometries: [
                    {
                        uuid: "cef79e52-526d-4263-b595-04fa2705974e",
                        type: "_meshfile_geometry",
                        format: "obj",
                        data: obj_contents
                    }
                ],
                materials: [],
                object: {
                    uuid: "00c2baef-9600-4c6b-b88d-7e82c40e004f",
                    type: "Mesh",
                    geometry: "cef79e52-526d-4263-b595-04fa2705974e"
                }
            }
        });
        viewer.handle_command({
            type: "set_property",
            path: path,
            property: "color",
            value: [0.7, 0.1, 0.1, 0.5]
        });
        // Up to here, it's the same as set_color.html. We should end up with
        // a reddish-transparent box. Now we exercise the API in various
        // incorrect ways with expected outcome.

        const object_path = path + "/<object>";
        const box_object = viewer.scene_tree.find(object_path.split('/').filter(x => x.length > 0));
        const set_prop = (property, value) => {
            viewer.handle_command({
                type: "set_property",
                path: object_path,
                property: property,
                value: value
            });
        };

        console.info("\n\nTEST START\n\n");

        console.info("\nAttempting to reference a non-existing property name.");

        run_with_expected_logs(1, 0, "missing direct property", () => {
            set_prop("test1", 42);
        });
        assert_undefined(box_object.object.test1, "missing direct property value");

        run_with_expected_logs(1, 0, "missing intermediate property", () => {
            set_prop("missing1.test2", "value2");
        });
        assert_undefined(box_object.object.missing1, "missing intermediate property value");

        run_with_expected_logs(1, 0, "missing array element", () => {
            set_prop("children[2].visible", false);
        });
        assert_undefined(box_object.object.children[2], "missing array element value");

        console.info("\nReferencing a property of a non-object.\n");

        run_with_expected_logs(1, 0, "penultimate element is non-object", () => {
            set_prop("material.opacity.temp", "value3");
        });
        assert_equal(box_object.object.material.opacity, 0.5, "opacity unchanged after invalid chain");

        const cast_shadow_before = box_object.object.castShadow;
        run_with_expected_logs(1, 0, "intermediate element is non-object", () => {
            set_prop("castShadow.bad.other", "value4");
        });
        assert_equal(box_object.object.castShadow, cast_shadow_before, "castShadow unchanged after invalid chain");

        console.info("\nSuccessful cases\n");

        run_with_expected_logs(0, 0, "valid chained property", () => {
            set_prop("material.opacity", 1);
        });
        assert_equal(box_object.object.material.opacity, 1, "valid chained property value");

        console.info("\nWe'll test the array access. We've added a non-Three.js " +
                     "array to the object (so that we don't mess up the " +
                     "rendering). We'll append an entry and assign a property " +
                     "to that array. We'll use set_property() to change that value.");
        box_object.object.test_array = [];
        box_object.object.test_array[2] = {};
        box_object.object.test_array[2].test_value = -1;
        run_with_expected_logs(0, 0, "valid array chain", () => {
            set_prop("test_array[2].test_value", 17);
        });
        assert_equal(box_object.object.test_array[2].test_value, 17, "valid array chain value");

        if (failures.length === 0) {
            status_dom.textContent = "PASS";
            status_dom.className = "pass";
        } else {
            status_dom.textContent = `FAIL: ${failures.length} assertion(s) failed`;
            status_dom.className = "fail";
        }

        console.error = original_console_error;
        console.warn = original_console_warn;

        console.info("\n\nTEST END\n\n");
        }

        run_test();
        </script>


        <style>
            body {
                margin: 0;
            }

            #meshcat-pane {
                width: 100vw;
                height: 100vh;
                overflow: hidden;
            }

            #test-message{
                width: 75vw;
                text-align: left;
                background-color: rgb(232, 232, 232);
                position: fixed;
                left: 0%;
                display: block;
                padding: 10px;
                z-index: 2;
            }

            #status-message {
                font-weight: bold;
                margin-top: 0.5rem;
            }

            #test-results {
                margin-bottom: 0;
                padding-left: 1.25rem;
            }

            .pass {
                color: #136f2d;
            }

            .fail {
                color: #b00020;
            }
        </style>
    </body>
</html>
